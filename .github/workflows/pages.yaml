name: pages

# Publishes README.md as the project's public page.
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

# pages: write + id-token: write are both required, or deploy-pages fails with
# "Resource not accessible".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Turn the README into the site index
        run: |
          mkdir -p _site_src
          cp README.md _site_src/index.md
          cat > _site_src/_config.yml <<'EOF'
          title: DevOps Bootcamp 2026 — Final Project
          description: Terraform, Ansible over SSM, Docker/ECR, Prometheus + Grafana, Cloudflare
          theme: jekyll-theme-cayman
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
