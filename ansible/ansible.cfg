[defaults]
inventory          = inventory.ini
interpreter_python = auto_silent
host_key_checking  = False
# community.general.yaml was removed in community.general 12; this is its
# built-in replacement (ansible-core >= 2.13).
callback_result_format = yaml

[ssh_connection]
# Irrelevant for the aws_ssm transport, but kept so a fallback to SSH still works.
pipelining = True
