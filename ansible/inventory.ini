# Generated by Terraform -- do not edit by hand.
# The aws_ssm connection plugin addresses hosts by EC2 instance ID, not IP.
#
# Host names differ from group names on purpose: Ansible warns loudly when a
# host and a group share a name.

[web]
web-server ansible_aws_ssm_instance_id=i-05c79e3f5c3218463

[monitoring]
monitoring-server ansible_aws_ssm_instance_id=i-09cb396686001557d

[all:vars]
# Ubuntu 24.04 ships ansible-core 2.16 / amazon.aws 7.2, where this plugin still
# lives in community.aws. It moves to amazon.aws.aws_ssm in a later release --
# current upstream docs show the new name, which does NOT exist on this version.
ansible_connection=community.aws.aws_ssm
ansible_aws_ssm_region=ap-southeast-1
ansible_aws_ssm_bucket_name=devops-bootcamp-terraform-raaid17
ansible_aws_ssm_bucket_prefix=ansible-transfer
ansible_python_interpreter=/usr/bin/python3

# Handy for templates and prometheus targets.
web_private_ip=10.0.0.5
monitoring_private_ip=10.0.0.136
ecr_image=396608796485.dkr.ecr.ap-southeast-1.amazonaws.com/devops-bootcamp/final-project-raaid17:latest
