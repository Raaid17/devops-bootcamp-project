---
- name: Sediakan web server dengan container aplikasi
  hosts: web
  become: true

  vars:
    app_container_name: devops-app
    app_port: 80
    # Idempotent by default: a re-run must report ok, not changed. Pass
    # -e app_pull=true to force a fresh pull when rolling out a new image.
    app_pull: false

  roles:
    - geerlingguy.docker

  tasks:
    - name: Pasang AWS CLI v2
      ansible.builtin.include_tasks: tasks/aws-cli.yaml

    - name: Dapatkan region dan registry dari imej ECR
      ansible.builtin.set_fact:
        ecr_registry: "{{ ecr_image | regex_replace('/.*$', '') }}"

    # Tiada kunci dalam playbook -- instance role devops-web-role yang benarkan
    # tarik imej dari ECR.
    - name: Log masuk ke ECR
      ansible.builtin.shell: >
        set -o pipefail &&
        /usr/local/bin/aws ecr get-login-password --region {{ ansible_aws_ssm_region | default('ap-southeast-1') }}
        | docker login --username AWS --password-stdin {{ ecr_registry }}
      args:
        # pipefail is a bash option; /bin/sh on Ubuntu is dash. Without it a
        # failing `aws` is masked and docker login just reports "password is empty".
        executable: /bin/bash
      register: ecr_login
      changed_when: false

    # Guna modul docker_container, bukan `command: docker run`, supaya main ini
    # idempotent -- larian kedua lapor ok, bukan changed.
    - name: Naikkan container aplikasi
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        image: "{{ ecr_image }}"
        state: started
        pull: "{{ app_pull | bool }}"
        restart_policy: unless-stopped
        ports:
          - "{{ app_port }}:80"
