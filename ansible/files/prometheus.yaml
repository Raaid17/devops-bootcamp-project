---
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pinned private IP -- Terraform fixes the web server at 10.0.0.5, so this
  # target survives a rebuild instead of chasing a rotating address.
  - job_name: node_exporter
    static_configs:
      - targets: ["10.0.0.5:9100"]
